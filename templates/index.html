<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Essay Grader</title>
    <!-- Modern Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #fafaf9;
            --card-bg: #ffffff;
            --card-border: #e7e5e4;
            --text-main: #1c1917;
            --text-muted: #78716c;
            --accent: #4338ca;
            --accent-hover: #3730a3;
            --success: #10b981;
            --success-bg: #f0fdf4;
            --success-border: #bbf7d0;
            --success-text: #166534;
            --warning: #f59e0b;
            --warning-bg: #fffbeb;
            --warning-border: #fde68a;
            --warning-text: #92400e;
            --danger: #ef4444;
            --danger-bg: #fef2f2;
            --danger-border: #fecaca;
            --danger-text: #991b1b;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4rem 1.5rem;
            line-height: 1.6;
            position: relative;
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
        }

        .blob-1 {
            width: 350px;
            height: 350px;
            background-color: rgba(99, 102, 241, 0.35); /* Indigo accent */
            top: -10%;
            left: -10%;
            animation: drift-1 15s ease-in-out infinite;
        }

        .blob-2 {
            width: 400px;
            height: 400px;
            background-color: rgba(251, 191, 36, 0.3); /* Warm amber accent */
            bottom: -15%;
            right: -10%;
            animation: drift-2 18s ease-in-out infinite;
        }

        .blob-3 {
            width: 300px;
            height: 300px;
            background-color: rgba(16, 185, 129, 0.3); /* Soft green accent */
            top: 40%;
            left: 50%;
            animation: drift-3 20s ease-in-out infinite;
        }

        @keyframes drift-1 {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 30px) scale(1.15); }
            100% { transform: translate(0, 0) scale(1); }
        }

        @keyframes drift-2 {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-60px, -40px) scale(0.9); }
            100% { transform: translate(0, 0) scale(1); }
        }

        @keyframes drift-3 {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, -50px) scale(1.1); }
            100% { transform: translate(0, 0) scale(1); }
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        header {
            text-align: center;
            margin-bottom: 3.5rem;
        }

        h1 {
            font-size: 2.75rem;
            font-weight: 700;
            color: #1e1b4b;
            margin-bottom: 0.75rem;
            letter-spacing: -0.03em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .title-icon {
            color: var(--accent);
            stroke-width: 2.2;
            flex-shrink: 0;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 400;
            max-width: 540px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 3.5rem;
            box-shadow: 0 10px 30px -5px rgba(28, 25, 23, 0.05), 0 4px 12px -2px rgba(28, 25, 23, 0.03);
        }

        .form-group {
            margin-bottom: 2.25rem;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        textarea {
            width: 100%;
            min-height: 280px;
            background-color: #ffffff;
            border: 1px solid #d6d3d1;
            border-radius: 12px;
            padding: 1.5rem;
            color: var(--text-main);
            font-family: inherit;
            font-size: 1.05rem;
            line-height: 1.65;
            resize: vertical;
            outline: none;
            transition: var(--transition);
        }

        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(67, 56, 202, 0.12);
        }

        button {
            width: 100%;
            background-color: var(--accent);
            border: none;
            border-radius: 12px;
            padding: 1.25rem;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.75rem;
        }

        button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(67, 56, 202, 0.15);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .results-section {
            margin-top: 3.5rem;
            border-top: 1px solid var(--card-border);
            padding-top: 3rem;
            display: none;
        }

        .results-section.show {
            display: block;
        }

        .score-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #fafaf9;
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 2rem 2.5rem;
            margin-bottom: 3rem;
        }

        .score-label {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-main);
        }

        .score-values {
            text-align: right;
        }

        .score-predicted {
            font-size: 3rem;
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
        }

        .score-raw {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.4rem;
        }

        .feedback-title {
            font-size: 1.35rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--text-main);
        }

        .feedback-list {
            list-style: none;
        }

        .feedback-item {
            background-color: #ffffff;
            border: 1px solid var(--card-border);
            border-left: 4px solid #d6d3d1;
            border-radius: 10px;
            padding: 1.25rem 1.75rem;
            margin-bottom: 1rem;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            transition: var(--transition);
        }

        .feedback-item:hover {
            border-color: #c2c0be;
            box-shadow: 0 4px 12px rgba(28, 25, 23, 0.02);
        }

        .feedback-item.good {
            border-left-color: var(--success);
        }

        .feedback-item.mild-notes {
            border-left-color: var(--warning);
        }

        .feedback-item.notable {
            border-left-color: var(--danger);
        }

        .badge {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            padding: 0.25rem 0.65rem;
            border-radius: 6px;
            letter-spacing: 0.05em;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
        }

        .badge::before {
            font-size: 0.85rem;
            line-height: 1;
        }

        .badge.good {
            background-color: var(--success-bg);
            border: 1px solid var(--success-border);
            color: var(--success-text);
        }

        .badge.good::before {
            content: "✓";
        }

        .badge.mild-notes {
            background-color: var(--warning-bg);
            border: 1px solid var(--warning-border);
            color: var(--warning-text);
        }

        .badge.mild-notes::before {
            content: "ℹ";
        }

        .badge.notable {
            background-color: var(--danger-bg);
            border: 1px solid var(--danger-border);
            color: var(--danger-text);
        }

        .badge.notable::before {
            content: "⚠";
        }

        .error-message {
            background-color: var(--danger-bg);
            border: 1px solid var(--danger-border);
            color: var(--danger-text);
            padding: 1.1rem;
            border-radius: 10px;
            margin-top: 1.5rem;
            display: none;
            text-align: center;
            font-weight: 500;
            font-size: 0.95rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 640px) {
            body {
                padding: 2.5rem 1rem;
            }
            .card {
                padding: 2.5rem 1.5rem;
                border-radius: 16px;
            }
            h1 {
                font-size: 2.25rem;
            }
            .score-container {
                flex-direction: column;
                gap: 1.25rem;
                text-align: center;
                padding: 1.75rem;
            }
            .score-values {
                text-align: center;
            }
            .feedback-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.75rem;
                padding: 1.25rem;
            }
            .badge {
                align-self: flex-start;
            }
        }
    </style>
</head>
<body>

<div class="bg-animation">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
</div>

<div class="container">
    <header>
        <h1>
            <svg class="title-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="32" height="32">
                <path d="M12 20h9"/>
                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
            </svg>
            AI Essay Grader
        </h1>
        <p class="subtitle">Enter your essay below to receive an automated score and instant feedback.</p>
    </header>

    <div class="card">
        <form id="graderForm">
            <div class="form-group">
                <label for="essayText">Essay Text</label>
                <textarea id="essayText" placeholder="Write or paste your essay here (minimum 10-20 words)..." required></textarea>
            </div>
            
            <button type="submit" id="submitBtn">
                <span class="spinner" id="btnSpinner"></span>
                <span id="btnText">Evaluate Essay</span>
            </button>
        </form>

        <div class="error-message" id="errorMessage"></div>

        <div class="results-section" id="resultsSection">
            <div class="score-container">
                <span class="score-label">Overall Essay Score</span>
                <div class="score-values">
                    <div class="score-predicted"><span id="displayScore">-</span><span style="font-size: 1.5rem; color: var(--text-muted); font-weight: 500;">/100</span></div>
                    <div class="score-raw" id="rawScore">ASAP Score: - | Raw score: -</div>
                </div>
            </div>

            <div class="feedback-container">
                <h3 class="feedback-title">Linguistic Diagnostics</h3>
                <ul class="feedback-list" id="feedbackList">
                    <!-- Dynamic feedback items inserted here -->
                </ul>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('graderForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const essayText = document.getElementById('essayText').value.trim();
        const submitBtn = document.getElementById('submitBtn');
        const btnSpinner = document.getElementById('btnSpinner');
        const btnText = document.getElementById('btnText');
        const resultsSection = document.getElementById('resultsSection');
        const errorMessage = document.getElementById('errorMessage');
        const feedbackList = document.getElementById('feedbackList');

        // UI Reset
        errorMessage.style.display = 'none';
        resultsSection.classList.remove('show');
        submitBtn.disabled = true;
        btnSpinner.style.display = 'inline-block';
        btnText.textContent = 'Analyzing...';

        try {
            const response = await fetch('/score', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ essay: essayText })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Server returned an error scoring the essay');
            }

            // Populate Score
            document.getElementById('displayScore').textContent = data.score_out_of_100;
            document.getElementById('rawScore').textContent = `ASAP Grade: ${data.predicted_score}/12 | Raw score: ${data.raw_score.toFixed(4)}`;

            // Populate Feedback List
            feedbackList.innerHTML = '';
            data.feedback.forEach(item => {
                const li = document.createElement('li');
                li.className = 'feedback-item';
                
                // Parse feedback text: e.g. "word_count: value=83.00 (bottom 10%) -> notable"
                // Split by "->" to separate the main detail from classification
                const parts = item.split('->');
                const detail = parts[0] ? parts[0].trim() : item;
                const classification = parts[1] ? parts[1].trim() : 'good';

                const cssClass = classification.replace(/\s+/g, '-');
                li.classList.add(cssClass);

                const detailSpan = document.createElement('span');
                detailSpan.textContent = detail;
                li.appendChild(detailSpan);

                const badge = document.createElement('span');
                badge.className = `badge ${cssClass}`;
                badge.textContent = classification;
                li.appendChild(badge);

                feedbackList.appendChild(li);
            });

            // Show results
            resultsSection.classList.add('show');
        } catch (error) {
            errorMessage.textContent = error.message;
            errorMessage.style.display = 'block';
        } finally {
            submitBtn.disabled = false;
            btnSpinner.style.display = 'none';
            btnText.textContent = 'Evaluate Essay';
        }
    });
</script>

</body>
</html>
